name: tests
on: [push, pull_request]
jobs:
  neovim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim 0.12.6
        run: |
          curl --fail --location --retry 3 \
            https://github.com/neovim/neovim/releases/download/v0.12.6/nvim-linux-x86_64.tar.gz \
            -o "$RUNNER_TEMP/neovim.tar.gz"
          mkdir "$RUNNER_TEMP/neovim"
          tar -xzf "$RUNNER_TEMP/neovim.tar.gz" -C "$RUNNER_TEMP/neovim" --strip-components=1
          echo "$RUNNER_TEMP/neovim/bin" >> "$GITHUB_PATH"
      - name: Install pinned test dependencies
        run: python3 tests/run.py fixtures
      - name: Unit, LSP protocol, actual input and PTY tests
        run: sh tests/run.sh --locked --output "$RUNNER_TEMP/test-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore
